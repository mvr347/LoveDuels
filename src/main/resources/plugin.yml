name: LoveDuels
version: 1.0.0
main: dev.lovelace.loveduels.LoveDuels
api-version: '1.21'
author: Lovelace
description: Advanced 1v1 duels system with bets, custom Horse+Spear mechanics, Royal duels, and spectator zones.
depend: [LoveCore]
softdepend: [PlaceholderAPI, LoveLeaderboards, LoveBehavior]

commands:
  duel:
    description: Главная команда дуэлей
    aliases: [дуэль, duels, дуэли]
    usage: /<command> [ник|принять|отклонить|выйти|наблюдать|топ|статистика|реванш|сдаться|месть]
    permission: loveduels.use
  loveduelsadmin:
    description: Админ-команды LoveDuels
    aliases: [lda, dueladmin, дуэльадмин]
    permission: loveduels.admin
    usage: /<command> [арена|кит|выдать|завершить|честь|перезагрузить]

permissions:
  loveduels.use:
    description: Использование дуэлей и GUI
    default: true
  loveduels.spectator.fly:
    description: Ограничённый полёт в зоне зрителей
    default: op
  loveduels.admin:
    description: Полный доступ к админ-командам
    default: op
