# =======================================================
#               LoveDuels Configuration
#         Paper 1.21.x / Java 25 by Lovelace
# =======================================================

settings:
  default_honor: 1000
  # 2026-11-05: ключ раньше не читался — кулдаун в меню настройки дуэли был зашит в коде (600 с).
  # Теперь меню берёт значение отсюда: 10 минут не дают заваливать одного игрока вызовами, но не мешают реваншу.
  challenge_cooldown_seconds: 600
  # 2026-11-05: сколько секунд соперник может принять вызов. Было зашито 90 с: хватает прочитать условия
  # и нажать кнопку, но вызов не висит в чате вечно.
  request_timeout_seconds: 90
  # 2026-11-05: стартовая ставка чести в меню (она же минимум и значение сброса). Было зашито 10 при стартовой
  # чести 1000, то есть 1%: заметно, но не разорительно.
  base_honor_bet: 10
  # Обратный отсчёт до начала боя (сек)
  # 2026-11-09: во время этого отсчёта бойцы стоят на своих стартовых точках и могут только поворачивать голову.
  # Раньше они свободно ходили до начала боя: можно было занять позицию, подобрать удобное место или подбежать вплотную,
  # и отсчёт терял смысл как время на подготовку. Падение остаётся разрешённым, чтобы игрок не зависал над полом.
  freeze_during_preparation: true
  preparation_countdown_seconds: 10
  preparation_countdown_royal_seconds: 15
  # Лимит длительности боя (сек)
  match_time_limit_seconds: 720
  round_time_limit_seconds: 600
  # После победы/конца: PvP в зоне арены выключен ещё N сек (пока игроки на арене)
  post_match_pvp_disable_seconds: 20

royal_duel:
  # 2026-11-05: ключ раньше не читался (3600 было зашито в меню); один билет в час не даёт устраивать королевские дуэли подряд.
  ticket_cooldown_seconds: 3600
  # Минимальная денежная ставка королевской дуэли. Число (медные единицы) или строка: "1g" = 1 золотая.
  # 2026-10-03: раньше минимум искался как «золотой номинал со значением 50–99», после смены номиналов
  # (золотая = 2 000) такой поиск не нашёл бы монету; теперь сумма задаётся явно. Королевская дуэль —
  # это «серьёзная» ставка, поэтому порог — одна золотая (ощутимо для обоих, но не разорительно).
  # Мёртвые ключи min_money_bet / min_gold_coins / winner_bonus_percent удалены: код их не читал.
  min_stake: "1g"
  honor_multiplier: 1.5

spectators:
  free_slots: 15
  # Цена места зрителя сверх бесплатных слотов: base + step за каждого следующего. Число или "2i".
  # 2026-10-03: 50/25 → 200/100 (две/одна железная монета) вместе с пересчётом номиналов; индекс цен LoveCore
  # применяется (economy.price-index).
  base_price: "2i"
  step_price: "1i"
  allow_spectator_flight_with_permission: true
  # Зрителям нельзя:
  block_drop: true
  block_combat: true
  block_pickup: true
  block_interact: true

horse_spear:
  target_points: 5
  points_normal_hit: 1
  points_perfect_hit: 2
  optimal_charge_min_ms: 1200
  optimal_charge_max_ms: 1800
  damage_normal: 3.5
  damage_perfect: 7.0
  horse_speed: 0.32
  thrust_cooldown_ms: 800
  dash_cooldown_ms: 4000
  # Слезть с коня нельзя, пока конь жив
  block_dismount_while_horse_alive: true

# Глифы монет (ItemsAdder / PlaceholderAPI): %img_iron_coin% и т.п.
coins:
  # Нужен PlaceholderAPI (+ расширение, которое рендерит %img_...%)
  use_placeholderapi: true
  glyph_prefix: "%img_"
  glyph_suffix: "%"
  # Пример: iron_coin → %img_iron_coin%

behavior:
  fleeing_politeness_penalty: 150
  broadcast_fleeing: true
  outcast_block_honor: true
  outcast_max_politeness_level: 0

discord:
  webhook_url: ""

protection:
  command_whitelist:
    - "duel"
    - "дуэль"
    - "msg"
    - "tell"
    - "w"
    - "r"

armistice:
  enabled: true
  duration_seconds: 15
  surrender_stake_percent: 25
  apply_to_honor: false
  skip_on_flee: true
  skip_on_admin: true
  skip_royal: true

bet_confirm:
  enabled: true

blood_revenge:
  enabled: true
  window_seconds: 60
  stake_multiplier: 2.0
  max_rematches: 2

debug:
  enabled: false
  verbose_match: false

# 2026-10-30: пасхалка «Как в вестерне». Если второй смертельный удар по другому бойцу пришёл не позже window-ticks
# после удара, закончившего поединок, оба видят реплику и получают запись в «Книге тайн» LoveEssential. Исход не
# меняется: победитель, ставки и рейтинг остаются прежними (настоящая ничья затронула бы ставки). 2 тика — в пределах
# одного обмена ударами, но чужой удар, пришедший вдогонку, уже не считается.
easter-eggs:
  western:
    enabled: true
    window-ticks: 2
