# =======================================================
#               LoveDuels Configuration
#         Paper 26.2 / Java 25 by Lovelace
# =======================================================

settings:
  # Начальное значение Чести для новых игроков
  default_honor: 1000

  # Кулдаун на повторный вызов одного и того же игрока (в секундах)
  # По умолчанию 10 минут (600 секунд)
  challenge_cooldown_seconds: 600

  # Длительность фазы подготовки (обратный отсчёт, в секундах)
  preparation_countdown_seconds: 5

  # Лимит времени на матч без раундов (в секундах, по умолчанию 12 минут = 720 секунд)
  match_time_limit_seconds: 720

  # Лимит времени на раунд (в секундах, по умолчанию 10 минут = 600 секунд)
  round_time_limit_seconds: 600

# =======================================================
#               Королевская Дуэль (Royal Duel)
# =======================================================
royal_duel:
  # Кулдаун на повторное использование Билета Королевской Дуэли (в секундах)
  # По умолчанию 1 час (3600 секунд)
  ticket_cooldown_seconds: 3600

  # Минимальная обязательная ставка деньгами для Королевской Дуэли
  min_money_bet: 500

  # Бонус победителю от королевской казны (в процентах от банка, например 25 = +25%)
  winner_bonus_percent: 25

  # Множитель очков Чести за победу в Королевской Дуэли
  honor_multiplier: 1.5

# =======================================================
#               Зрители и Трибуны (Spectators)
# =======================================================
spectators:
  # Количество бесплатных мест зрителей
  free_slots: 15

  # Базовая стоимость билета зрителя после исчерпания бесплатных мест (в монетах)
  base_price: 50

  # Шаг увеличения стоимости за каждого последующего зрителя
  step_price: 25

  # Разрешать ли зрителям летать в зоне трибун при наличии права loveduels.spectator.fly
  allow_spectator_flight_with_permission: true

# =======================================================
#               Horse + Spear (Копьё и Конь)
# =======================================================
horse_spear:
  # Количество очков для победы в конном турнире
  target_points: 5

  # Очки за обычный удар
  points_normal_hit: 1

  # Очки за идеальный / perfect удар
  points_perfect_hit: 2

  # Оптимальное окно заряда копья (в миллисекундах)
  optimal_charge_min_ms: 1200
  optimal_charge_max_ms: 1800

  # Урон от обычного и идеального удара
  damage_normal: 3.5
  damage_perfect: 7.0

  # Базовая скорость турнирного коня
  horse_speed: 0.32

  # Кулдаун рывка (dash) на коне (в миллисекундах)
  dash_cooldown_ms: 4000

# =======================================================
#               Интеграция с LoveBehavior
# =======================================================
behavior:
  # Снятие очков вежливости в LoveBehavior за бегство/выход из дуэли
  fleeing_politeness_penalty: 150

  # Глобальное объявление о побеге с позором
  broadcast_fleeing: true

# =======================================================
#               Discord Webhook (Королевские Дуэли)
# =======================================================
discord:
  # URL вебхука Discord для публикации создания и итогов Королевских Дуэлей
  webhook_url: ""

# =======================================================
#               Защиты и Whitelist команд
# =======================================================
protection:
  # Список разрешённых команд во время дуэли
  command_whitelist:
    - "duel"
    - "дуэль"
    - "msg"
    - "tell"
    - "w"
    - "r"
