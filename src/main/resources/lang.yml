    rematch_name: "<yellow><b>⚔ РЕВАНШ</b></yellow>"
    rematch_lore:
      - "<gray>Соперник: <gold>{opponent}"
      - ""
      - "<yellow>➤ Нажмите, чтобы предложить реванш!"
