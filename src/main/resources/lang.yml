prefix: "<gradient:#FFD700:#C9A227>[LoveDuels]</gradient> "

categories:
  melee:
    name: "Ближний бой"
    description: "Кулаки, рыцарское снаряжение или свои вещи."
  ranged:
    name: "Дальний бой"
    description: "Луки и арбалеты."
  mounted:
    name: "Всадники"
    description: "Турнир на копьях верхом."

types:
  own_inventory:
    name: "<gold>Свои вещи</gold>"
    description: "Сражение в собственной экипировке."
  kit:
    name: "<aqua>Рыцарское снаряжение</aqua>"
    description: "Равный набор брони и оружия."
  sword:
    name: "<yellow>Мечи</yellow>"
    description: "Классическая дуэль на мечах."
  bow:
    name: "<green>Луки</green>"
    description: "Стрелковая дуэль на луках."
  crossbow:
    name: "<dark_aqua>Арбалеты</dark_aqua>"
    description: "Дуэль на арбалетах."
  horse_spear:
    name: "<gold>Копьё</gold>"
    description: "Турнир верхом с зарядом копья."
  fists:
    name: "<red>Кулаки</red>"
    description: "Голые руки, без оружия и брони."

gui:
  common:
    back:
      name: "<yellow>Назад</yellow>"
      lore:
        - "<gray>Предыдущее меню</gray>"
    close:
      name: "<red>Закрыть</red>"
      lore:
        - "<gray>Закрыть окно</gray>"
    profile:
      name: "<gold>{player}</gold>"
      lore:
        - "<gray>Профиль LoveDuels</gray>"

  main_menu:
    title: "<gradient:#C9A227:#E8D48B>Турниры и дуэли</gradient>"
    challenge:
      name: "<gold>Бросить вызов</gold>"
      lore:
        - "<gray>Тренировка, обычная или королевская дуэль."
        - ""
        - "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>выбрать режим</white>"
    spectate:
      name: "<light_purple>Наблюдение</light_purple>"
      lore:
        - "<gray>Смотрите идущие поединки с трибун."
        - ""
        - "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>список боёв</white>"

  challenge_mode:
    title: "<gold>Выбор режима вызова</gold>"
    training:
      name: "<aqua>Тренировочная дуэль</aqua>"
      lore:
        - "<gray>Без ставок и без изменения Чести."
        - "<gray>Только практика и разминка."
        - ""
        - "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>выбрать соперника</white>"
    normal:
      name: "<gold>Дуэль</gold>"
      lore:
        - "<gray>Обычный поединок со ставками"
        - "<gray>и рейтингом Чести."
        - ""
        - "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>выбрать соперника</white>"
    royal:
      name: "<gradient:#C9A227:#E8D48B>Королевская дуэль</gradient>"
      lore:
        - "<gray>Нужен билет. Глашатай, бонусы,"
        - "<gray>Discord и повышенная Честь."
        - ""
        - "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>выбрать соперника</white>"

  player_select:
    title_training: "<aqua>Соперник · тренировка</aqua>"
    title_normal: "<gold>Соперник · дуэль</gold>"
    title_royal: "<gradient:#C9A227:#E8D48B>Соперник · королевская</gradient>"
    no_players:
      name: "<gray>Нет доступных игроков</gray>"
      lore:
        - "<gray>Все оффлайн или уже в бою."
        - "<yellow>Пригласите кого-нибудь на сервер.</yellow>"
    player_card:
      name: "<gold>{name}</gold>"
      health: "<gray>Здоровье: <red>{health}</red>"
      ping: "<gray>Пинг: <white>{ping} ms</white>"
      cooldown: "<red>Кулдаун вызова: {cd}с</red>"
      ready: "<green>Готов к вызову</green>"
      click_hint: "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>настроить дуэль</white>"

  duel_setup:
    title_training: "<aqua>Тренировка</aqua>"
    title_normal: "<gold>Настройка дуэли</gold>"
    title_royal: "<gradient:#FFD700:#F5E6A3:#C9A227>Королевская дуэль</gradient>"
    opponent_info:
      name: "<gold>{name}</gold>"
      lore:
        - "<gray>HP <red>{health}</red> · пинг <white>{ping}</white>"
    category:
      name: "<gold>Категория: </gold><white>{category}</white>"
      hint_next: "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>следующая</white>"
      hint_prev: "<yellow>ПКМ</yellow> <dark_gray>—</dark_gray> <white>предыдущая</white>"
    subtype:
      name: "<aqua>Режим: </aqua>{type}"
      only_one: "<dark_gray>Единственный вариант</dark_gray>"
      hint_next: "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <gray>следующий</gray>"
      hint_prev: "<yellow>ПКМ</yellow> <dark_gray>—</dark_gray> <gray>предыдущий</gray>"
    money_bet:
      name_normal: "<gold>Ставка монетами</gold>"
      name_royal: "<gradient:#FFD700:#C9A227>Ставка монетами</gradient>"
      royal_header: "<gradient:#FFD700:#C9A227>Королевская ставка</gradient>"
      royal_min: "<gray>Минимум: </gray>{min}"
      current: "<gray>Текущая ставка:</gray>"
      denom: "<gray>Номинал: </gray>{glyph}"
      controls: "<yellow>Shift</yellow> <gray>•</gray> <gray>сменить</gray>  <yellow>ЛКМ</yellow> <gray>•</gray> <gray>+</gray>  <red>ПКМ</red> <gray>•</gray> <gray>−</gray>"
      balance: "<gray>Баланс: </gray>{balance}"
    honor_bet:
      name: "<gold>Ставка чести</gold>"
      current: "<gray>Текущая ставка: <yellow>{honor}</yellow>"
      royal_note: "<gray>В королевской дуэли Честь выше ценится.</gray>"
      hint_multiply: "<yellow>ЛКМ</yellow> <dark_gray>—</dark_gray> <white>×2</white>"
      hint_divide: "<red>ПКМ</red> <dark_gray>—</dark_gray> <white>÷2 (или база)</white>"
    send_button:
      name_training: "<aqua>Отправить вызов</aqua>"
      name_normal: "<green>Отправить вызов</green>"
      name_royal: "<gradient:#FFD700:#F5E6A3:#C9A227>Отправить королевский вызов</gradient>"
      lore_training:
        - "<gray>Без ставок. Соперник примет — и сразу бой."
      lore_normal:
        - "<gray>Соперник увидит параметры и сможет принять."
    invite:
      prefix_royal: "<gradient:#FFD700:#F5E6A3:#C9A227>══ Королевский вызов ══</gradient>\n"
      prefix_training: "<aqua>[Тренировочный вызов]</aqua>\n"
      prefix_normal: "<gold>[Вызов на дуэль]</gold>\n"
      money_free: "<gray>Без ставок</gray>"
      money_line: "<gray>Монеты: </gray>{money}"
      honor_line: "\n<gray>Честь: <yellow>{honor}</yellow>"
      body: "<white><gold>{player}</gold> вызывает вас.\n<gray>Категория: <white>{category}</white>\n<gray>Режим: </gray>{type}\n{money}{honor}\n"
      accept_btn: "<green>[Принять]</green>"
      accept_btn_royal: "<gradient:#FFD700:#C9A227>[Принять]</gradient>"
      deny_btn: "<red>[Отклонить]</red>"
      hover_accept: "<green>Принять</green>"
      hover_deny: "<red>Отклонить</red>"
      sent: "<green>Вызов отправлен <gold>{opponent}</gold>."
    errors:
      offline: "<red>Игрок покинул сервер."
      in_match: "<red>Этот игрок уже в бою."
      cooldown: "<red>Кулдаун вызова: <gold>{cd}с</gold>."
      no_arena: "<red>Для режима <white>{type}</white><red> нет настроенной арены."
      royal_active: "<red>Уже идёт королевская дуэль."
      royal_ticket_cd: "<red>Кулдаун билета: <gold>{cd}</gold>."
      no_royal_ticket: "<red>Нет билета королевской дуэли."
      min_royal_bet: "<red>Минимум для королевской: {min}"

  confirm_bet:
    title: "<red><b>Подтверждение ставки</b>"
    confirm_name: "<green><b>✔ Подтвердить</b>"
    confirm_lore:
      - "<gray>Ставка: </gray>{money}"
      - "{honor}"
      - ""
      - "<green>ЛКМ — отправить вызов"
    honor_line: "<gray>Честь: <yellow>{honor}"
    honor_none: "<gray>Честь: <white>нет"
    cancel_name: "<red><b>✖ Отмена</b>"
    cancel_lore:
      - "<gray>Вернуться к настройке дуэли"
      - ""
      - "<red>ЛКМ — отмена"

  kit_select:
