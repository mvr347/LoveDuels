    ticket_no: "<red>✖ Отсутствует"
    arena_busy: "<red>✖ Занято (идёт бой)"
    arena_free: "<green>✔ Свободно"
    cd_ready: "<green>✔ Готов"
    cd_wait: "<red>⏳ {cd}с"
    btn_available: "<gradient:#FFD700:#FFA500><b>⚔ БРОСИТЬ КОРОЛЕВСКИЙ ВЫЗОВ</b></gradient>"
    btn_unavailable: "<red><b>Недоступно для вызова</b></red>"
