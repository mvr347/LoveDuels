    controls_minus: "<red>ПКМ</red> <dark_gray>—</dark_gray> <white>− номинал</white>"
    reset_hint: "<dark_gray>Смена ставки сбрасывает готовность</dark_gray>"
    money_item_name_normal: "<gold>Ставка монетами</gold>"
    money_item_name_royal: "<gradient:#FFD700:#C9A227>Ставка монетами</gradient>"
    status_ready: "<green>Готов</green>"
    status_not_ready: "<red>Не готов</red>"
    status_header: "<gold>{name}</gold> · {status}"
    status_lore:
      - "<gray>Оба должны подтвердить"
